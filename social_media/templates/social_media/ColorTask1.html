{% extends "global/Page.html" %}
{% load otree static %}

{% block content %}
<h3 style="color:darkred; font-weight:bold;">Color task: 1 of 6</h3>
<br>

<p style="font-size:1.4em; color:blue; font-weight:bold;">RED</p>
{{ formfield player.stroop_1 }}

<script>
(function () {
    var form = document.querySelector('form');
    if (!form) return;
    var submitted = false;
    function tryAutoSubmit(e) {
        if (submitted) return;
        var t = e.target;
        if (!t || t.name !== 'stroop_1') return;
        var v = (t.value || '').trim();
        if (!v) return;
        submitted = true;
        if (typeof form.requestSubmit === 'function') form.requestSubmit();
        else form.submit();
    }
    form.addEventListener('change', tryAutoSubmit);
    form.addEventListener('input', tryAutoSubmit);
})();
</script>
{% endblock %}
