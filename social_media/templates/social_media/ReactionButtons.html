<div class="fb-like-row" role="group" aria-label="React to this message">
    {% for option in reaction_options %}
    <button type="button" class="fb-like" data-reaction="{{ option.value }}"
            aria-label="{{ option.label }}" title="{{ option.label }}" aria-pressed="false"><span aria-hidden="true">{{ option.emoji }}</span></button>
    {% endfor %}
</div>
<script>
(function () {
    var field = document.getElementById('id_received_reaction');
    var buttons = document.querySelectorAll('[data-reaction]');
    var key = 'reaction_{{ participant.code }}_{{ player.round_number }}_{{ reaction_field }}';
    function select(value) {
        if (value !== 'none' && !Array.prototype.some.call(buttons, function (button) { return button.dataset.reaction === value; })) value = 'none';
        field.value = value;
        buttons.forEach(function (button) {
            var selected = button.dataset.reaction === value;
            button.classList.toggle('fb-like-on', selected);
            button.setAttribute('aria-pressed', String(selected));
        });
    }
    try { select(sessionStorage.getItem(key) || field.value); }
    catch (_) { select(field.value); }
    buttons.forEach(function (button) {
        button.addEventListener('click', function () {
            select(field.value === button.dataset.reaction ? 'none' : button.dataset.reaction);
            try { sessionStorage.setItem(key, field.value); } catch (_) {}
        });
    });
})();
</script>
