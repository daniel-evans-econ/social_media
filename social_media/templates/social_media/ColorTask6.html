{% extends "global/Page.html" %}
{% load otree static %}

{% block content %}
<h3 style="color:darkred; font-weight:bold;">Color task: {{ stroop_index }} of {{ stroop_total }}</h3>
<br>

<p style="font-size:1.6em; color:{{ stroop_color }}; font-weight:bold;{% if stroop_color == 'yellow' %} -webkit-text-stroke: 0.5px #888;{% endif %}">{{ stroop_word }}</p>
{{ formfield player.stroop_6 }}

<input type="hidden" name="stroop_6_response_time" id="stroop-response-time" value="">

<script>
(function () {
    var form = document.querySelector('form');
    if (!form) return;
    var pageLoadAt = (typeof performance !== 'undefined' && performance.now)
        ? performance.now() : Date.now();
    var submitted = false;
    function recordRT() {
        var hidden = document.getElementById('stroop-response-time');
        if (!hidden || hidden.value) return;
        var now = (typeof performance !== 'undefined' && performance.now)
            ? performance.now() : Date.now();
        hidden.value = ((now - pageLoadAt) / 1000).toFixed(3);
    }
    function tryAutoSubmit(e) {
        if (submitted) return;
        var t = e.target;
        if (!t || t.name !== 'stroop_6') return;
        var v = (t.value || '').trim();
        if (!v) return;
        submitted = true;
        recordRT();
        if (typeof form.requestSubmit === 'function') form.requestSubmit();
        else form.submit();
    }
    form.addEventListener('change', tryAutoSubmit);
    form.addEventListener('input', tryAutoSubmit);
    form.addEventListener('submit', recordRT, true);
})();
</script>
{% endblock %}
