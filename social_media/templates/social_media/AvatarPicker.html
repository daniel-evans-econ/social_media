<style>
.care-icon { width: 1.3em; height: 1.3em; vertical-align: middle; }
.avatar-picker { margin-top: 1em; max-width: 420px; }
.avatar-control { position: relative; display: inline-block; padding: 5px; border: 1px solid #e2e6eb; border-radius: 12px; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.avatar-trigger { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 2px; border: 2px solid #d8dde3; border-radius: 50%; background: white; color: #777; font: inherit; font-size: 22px; cursor: pointer; }
.avatar-trigger img { width: 100%; height: 100%; border-radius: 50%; }
.avatar-trigger.selected { border-color: #8eb9ec; }
.avatar-trigger:focus-visible, .avatar-option:focus-within { outline: 2px solid #222; outline-offset: 2px; }
.avatar-options { position: absolute; z-index: 10; top: 100%; left: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); width: min(280px, calc(100vw - 48px)); box-sizing: border-box; gap: 4px; padding: 8px; margin: 0; border: 1px solid #ddd; border-radius: 16px; background: white; box-shadow: 0 3px 14px #0002; }
.avatar-options[hidden] { display: none; }
.avatar-option { position: relative; padding: 2px; margin: 0; border: 2px solid transparent; border-radius: 50%; cursor: pointer; }
.avatar-option img { width: 100%; height: auto; display: block; }
.avatar-option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.avatar-option:has(input:checked) { border-color: #1877f2; background: #e8f0ff; }
</style>
<fieldset class="avatar-picker"><legend style="font-size:1em">Choose an <strong style="color:darkred;">avatar</strong> to appear beside your messages.</legend>
<div class="avatar-control">
<button type="button" class="avatar-trigger" aria-label="Choose an avatar" aria-expanded="false" aria-controls="avatar-options"><span aria-hidden="true">?</span></button>
<div id="avatar-options" class="avatar-options" role="group" aria-label="Avatar choices" hidden>
{% for avatar in avatar_options %}<label class="avatar-option">
<input type="radio" name="avatar_picker" value="{{ avatar.value }}" aria-label="Avatar {{ forloop.counter }}" {% if selected_avatar == avatar.value %}checked{% endif %}>
<img src="/static/social/avatars/{{ avatar.value }}.svg" alt="">
</label>{% endfor %}
</div></div></fieldset>
<p id="avatar-status" role="status" style="font-size:.9em"></p>
<script>
(function () {
    var pending = false, selected = document.querySelector('[name=avatar_picker]:checked');
    var status = document.getElementById('avatar-status');
    var control = document.querySelector('.avatar-control');
    var trigger = control.querySelector('.avatar-trigger');
    var palette = control.querySelector('.avatar-options');
    function open(value) { palette.hidden = !value; trigger.setAttribute('aria-expanded', String(value)); }
    function showSelection() {
        if (!selected) return;
        var image = document.createElement('img');
        image.src = '/static/social/avatars/' + selected.value + '.svg'; image.alt = '';
        trigger.replaceChildren(image); trigger.classList.add('selected');
        trigger.setAttribute('aria-label', selected.getAttribute('aria-label') + ' selected; change avatar');
    }
    control.addEventListener('pointerenter', function (event) { if (event.pointerType === 'mouse') open(true); });
    control.addEventListener('pointerleave', function (event) {
        if (event.pointerType === 'mouse' && !palette.contains(document.activeElement)) open(false);
    });
    trigger.addEventListener('click', function () { open(true); });
    trigger.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowDown') {
            event.preventDefault(); open(true);
            (palette.querySelector('input:checked') || palette.querySelector('input')).focus();
        }
    });
    control.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') { open(false); trigger.focus(); }
    });
    control.addEventListener('focusout', function (event) {
        // A pointer click on a portrait label briefly focuses the body before its radio.
        if (event.relatedTarget && !control.contains(event.relatedTarget)) open(false);
    });
    document.addEventListener('click', function (event) { if (!control.contains(event.target)) open(false); });
    window.liveRecv = function (data) {
        if (selected && data.avatar === selected.value) { pending = false; status.textContent = ''; }
    };
    palette.querySelectorAll('input').forEach(function (radio) {
        radio.addEventListener('change', function () {
            selected = radio; pending = true; status.textContent = 'Saving your avatar…';
            showSelection(); open(false); trigger.focus();
            liveSend({avatar: radio.value});
        });
        radio.addEventListener('click', function () {
            if (radio.checked) { open(false); trigger.focus(); }
        });
    });
    showSelection();
    document.querySelector('form').addEventListener('submit', function (event) {
        if (!selected || pending) {
            event.preventDefault();
            status.textContent = pending ? 'Please wait while your avatar is saved.' : 'Please choose an avatar.';
        }
    });
})();
</script>
